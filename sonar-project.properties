# SonarQube Project Configuration for ACEest Fitness & Gym Tracker
# ==================================================================

# Project identification
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym Tracker
sonar.projectVersion=1.3.0

# Source code encoding
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=aceest_fitness_app.py
sonar.tests=test_aceest_fitness_app.py

# Python specific configuration
sonar.language=py
sonar.python.version=3.11

# Coverage report paths
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions (optional)
sonar.exclusions=**/venv/**,**/versions/**,**/htmlcov/**,**/__pycache__/**,**/tests/**

# Test exclusions
sonar.test.exclusions=test_*.py,**/tests/**

# Quality gates
# Set minimum coverage threshold
sonar.coverage.exclusions=test_*.py

# Code smells and bugs
sonar.issue.ignore.multicriteria=e1,e2

# Rule 1: Ignore certain warnings in test files
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/test_*.py

# Rule 2: Ignore import order issues
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S1542
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py

# Additional settings
sonar.python.pylint.reportPath=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json
