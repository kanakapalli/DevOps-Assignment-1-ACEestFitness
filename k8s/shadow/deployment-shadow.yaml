apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    strategy: shadow
    version: shadow
spec:
  replicas: 2  # Fewer replicas than production since it only receives mirrored traffic
  selector:
    matchLabels:
      app: aceest-fitness
      version: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        strategy: shadow
        version: shadow
      annotations:
        # Annotation to indicate this is a shadow deployment
        deployment.type: "shadow"
    spec:
      containers:
      - name: aceest-fitness
        image: docker.io/aceest-fitness:latest  # New version under test
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "5000"
        - name: ENVIRONMENT
          value: "shadow"
        - name: VERSION_TYPE
          value: "SHADOW"
        - name: LOG_LEVEL
          value: "DEBUG"  # More verbose logging for shadow
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
