apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-service
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
spec:
  type: LoadBalancer
  selector:
    app: aceest-fitness
    version: blue  # Initially points to blue deployment
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5000
    nodePort: 30001
  sessionAffinity: None

---
# Service for Blue deployment (for testing)
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-blue-service
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    version: blue
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness
    version: blue
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5000

---
# Service for Green deployment (for testing before switch)
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-green-service
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    version: green
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness
    version: green
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5000
